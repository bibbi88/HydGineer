ircuits to start from.`,`Right-click a component for Rotate, Copy, and Delete.`,`Right-click a hydraulic port to put a tank symbol on it - the quick way to draw a return line, e.g. on a valve’s T port.`,`Arrow keys nudge the selected component; hold Shift to move a full grid step further.`,`Delete or Backspace removes the current selection.`,`Ctrl+C / Ctrl+V copies and pastes the selection.`,`Ctrl+Z undoes, Ctrl+R redoes.`,`Escape cancels a wire you’re in the middle of drawing, or clears the current selection if nothing is being drawn.`]},{heading:`How the hydraulics are calculated`,tips:[`Every frame the whole circuit is solved for its pressures and flows: oil is conserved at every line (what flows in flows out), every valve path follows its own characteristic, and every cylinder and motor is in force/torque balance with its load.`,`Units: pressure in bar (gauge, tank = 0), flow in L/min. F = p·A, v = Q/A for a cylinder; n = Q/V and T = Δp·V/2π for a motor.`,`Directional valve paths, check valves and throttles are orifices: Δp grows with the square of the flow. A valve’s nominal flow is the flow per path at a 5 bar drop; a throttle is a sharp-edged orifice of the set diameter (Cd 0.62, oil 870 kg/m³).`,`The pump delivers displacement × speed, less leakage that grows with pressure (the volumetric efficiency is reached at the rated pressure). With nowhere for the oil to go and no relief valve, the pressure runs away - a warning shows.`,`A relief valve stays shut below its cracking pressure, then opens just far enough to pass the surplus flow (10 L/min per bar of override). The flow it dumps is heat.`,`Cylinders: the load force opposes extension (enter it negative for a load that pulls the rod out); seal friction has to be overcome before the piston moves at all.`,`The oil is very slightly compressible (bulk modulus 10 000 bar), so a closed-off volume keeps its pressure, and pressure takes a moment to build up. Steady values are exact.`,`Hover over a wire or a port while simulating for its exact pressure and flow. The longest wire of each line shows them as a label; pressure lines are red (darker = higher), return lines blue, and the moving dashes show which way the oil flows.`,`Flow dividers split one inlet flow between outlets A and B. The spool type holds the split with a pressure-compensating sleeve that throttles the lighter-loaded side, so the inlet runs at the higher load pressure and the throttling becomes heat. The rotary (gear) type splits by displacement on a common shaft: the inlet sees the mean of the outlet pressures, and one outlet can rise above the inlet pressure (intensification). With either type, blocking one outlet stops the other, and both combine flow in reverse.`,`Hand-lever valves are switched by clicking the left or right half of the symbol while the simulation runs; click the same side again to return to centre.`]},{heading:`Electro-hydraulics`,tips:[`The Electrical group holds a +24 V and a 0 V supply, contacts, a push button, coils and a lamp. Electrical terminals (dark blue) only connect to other electrical terminals.`,`A coil publishes its name (e.g. Y1, K1) while energized. A solenoid valve with the same name shifts, and a contact whose "Signal" is that name (a relay contact) closes.`,`Each solenoid valve you place takes the next free Y name, so two valves never start out sharing a coil. If you rename one onto another the labels turn red - allowed, since a real circuit may drive several valves off one output, but usually a slip.`,`Set a contact’s Signal to a cylinder sensor label (e.g. A1) to use it as a position sensor, or to a pressure switch’s name (e.g. S1) to switch on pressure.`,`A pump can be switched by a coil: put its name (e.g. K1) in the pump’s "Motor signal".`,`The PLC has inputs I0.0-I0.3 (true while wired to +24 V), outputs Q0.0-Q0.3 (drive their terminal to +24 V when true) and L+/M supply terminals. Double-click the PLC to write its logic as a function block diagram: place signal, AND/OR/XOR/NOT, timer/counter/latch and coil blocks, then drag from a block’s output dot to another’s input dot to wire them.`,`The inspector’s "Program" field is a read-only preview of the diagram’s generated logic (e.g. "Q0.0 = (I0.0 | Q0.0) & !I0.1" for a start/stop self-hold) - edit it by double-clicking the PLC, not by typing there.`,`Wires that are connected to +24 V during a run turn amber. Hold the mouse on an electric push button to press it (Ctrl+click latches).`]},{heading:`Project info & the page frame`,tips:[`The project name sits in the toolbar. Date, author, checked by and company live in the inspector’s "Project info" section (visible with nothing selected), and all of them appear on the sheet’s title block.`,`The page frame (None/A4/A3) draws a sheet outline with that title block, centered on the current diagram when picked - a visual guide only, not a hard boundary.`]},{heading:`Exporting`,tips:[`Export (the toolbar’s download icon) opens a dialog with a live preview and a choice of what to crop to: Everything, the page frame, or whatever’s currently in view.`,`To export just part of a diagram, pan/zoom to that region first, then pick "Current view".`]}];function Uc(){let e=document.createElement(`div`);e.className=`modalBackdrop`,e.addEventListener(`click`,t=>{t.target===e&&a()});let t=document.createElement(`div`);t.className=`exportDialog tipsDialog`,e.appendChild(t);let n=document.createElement(`div`);n.className=`exportDialogHeader`;let r=document.createElement(`h2`);r.textContent=`Tips`;let i=document.createElement(`button`);i.className=`exportDialogClose`,i.textContent=`✕`,i.setAttribute(`aria-label`,`Close`),i.addEventListener(`click`,()=>a()),n.append(r,i),t.appendChild(n);for(let e of Hc){let n=document.createElement(`div`);n.className=`inspectorSectionHeading`,n.textContent=e.heading,t.appendChild(n);let r=document.createElement(`ul`);r.className=`tipsList`;for(let t of e.tips){let e=document.createElement(`li`);e.textContent=t,r.appendC     <div class="app">
      <header class="topbar" id="topbar" role="toolbar" aria-label="Main toolbar"></header>

      <aside class="sidebar">
        <h2>Component Library</h2>

      </aside>

      <main class="workspace">
        <div id="gridLayer"></div>
        <div id="viewport">

          <svg id="connLayer" class="layer"></svg>
          <div id="compLayer" class="layer"></div>
          <svg id="handleLayer" class="layer"></svg>
        </div>
        <div class="hint">
          <span>Drag components from the sidebar onto the canvas</span>
          <span class="hintSep">·</span>
          <span><span class="hintKey">Pan</span> = Alt + left-drag, or middle-drag</span>
          <span class="hintSep">·</span>
          <span><span class="hintKey">Zoom</span> = scroll</span>
          <span class="hintSep">·</span>
          <span><span class="hintKey">Select</span> = left-drag</span>
        </div>
      </main>

      <aside class="inspectorPanel">
        <h2>Inspector</h2>
        <div id="inspector"></div>
      </aside>
    </div>
